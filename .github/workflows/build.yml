name: Build Android APK & KPM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kpm:
    name: Compile KPM (Kernel Module)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross-Compilation Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make build-essential libssl-dev bc bison flex libelf-dev

      - name: Fetch Generic Kernel Headers & Fully Prepare Symbols
        run: |
          git clone --depth 1 https://github.com/torvalds/linux.git kernel-headers
          cd kernel-headers
          
          # Export global architecture and compiler toolchain variables
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          # Configure and generate the mandatory Module.symvers and symbol configurations
          make defconfig
          make modules_prepare

      - name: Compile KPM Binary
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          # Build module pointing to the fully prepared kernel headers directory
          make KDIR=$PWD/kernel-headers all

      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-control-kpm
          path: bridge_control_kpm.ko

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
