name: Build Independent App and KPM Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kpm:
    name: Compile Standalone KPM Driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross-Compilation Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential

      - name: Fetch KernelPatch Source Headers
        run: |
          BASE_URL="https://github.com"
          REPO_PATH="bmax121/KernelPatch.git"
          git clone --depth 1 "$BASE_URL/$REPO_PATH" kp-source

      - name: Compile KPM Target File
        run: |
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          
          # FIX: Included both the explicit kpmod/include and src/include directories
          $CC -O2 -fno-pic -fno-stack-protector -mno-outline-atomics \
              -I$PWD/kp-source/kpmod/include \
              -I$PWD/kp-source/src/include \
              -c bridge_control_kpm.c -o bridge_control_kpm.o
              
          $LD -r bridge_control_kpm.o -o bridge_control_kpm.kpm

      - name: Upload Raw KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-control-driver
          path: bridge_control_kpm.kpm

  build-apk:
    name: Build Pure Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Pure Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Clean APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-android-app
          path: app/build/outputs/apk/debug/app-debug.apk
