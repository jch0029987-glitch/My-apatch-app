name: Build Android APK & KPM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kpm:
    name: Compile KPM (Kernel Module)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross-Compilation Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make build-essential libssl-dev bc

      - name: Fetch Generic Kernel Headers / Setup Build Tree
        run: |
          git clone --depth 1 https://github.com/torvalds/linux.git kernel-headers || true
          cd kernel-headers
          make ARCH=arm64 defconfig
          make ARCH=arm64 prepare
          make ARCH=arm64 scripts

      - name: Compile KPM Binary
        run: |
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               KDIR=$PWD/kernel-headers \
               all

      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-control-kpm
          path: bridge_control_kpm.ko

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
